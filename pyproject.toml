[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-warden"
version = "0.4.0"
description = "Architectural watchdog, custom system checks, and AI safety guardrails for Django projects."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Maiquel", email = "maiquel@maiquelleonel.com.br" }
]
dependencies = [
    "Django>=4.2",
    "django-ai-boost>=0.9.0",
    "ruff>=0.16.3",
]

[project.optional-dependencies]
dev = [
    "django-ai-boost>=0.8.0",
    "ruff>=0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["django_warden"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C90"]
mccabe = { max-complexity = 10 }

[tool.django-warden]
# Silences the successful installation Info messages of MCPs during standard system checks,
# keeping the terminal clean. They will still be shown during `warden_audit`.
silence_mcp_info = true
